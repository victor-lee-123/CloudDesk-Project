version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: helpdesk_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - clouddesk-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: helpdesk_backend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - clouddesk-net
    depends_on:
      db:
        condition: service_healthy   # ← waits until MySQL is actually ready
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

  frontend:
    build: ./frontend
    container_name: helpdesk_frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - clouddesk-net
    depends_on:
      - backend

volumes:
  db_data:

networks:
  clouddesk-net:
    driver: bridge
